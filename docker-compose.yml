services:
  postgres:
    image: postgres:16-bookworm
    container_name: codemaven-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codemaven-db}
      POSTGRES_USER: ${POSTGRES_USER:-codemaven-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codemaven-password}

    ports:
      - "${POSTGRES_PORT:-5433}:5432"

    volumes:
      - codemaven_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-codemaven-user} -d ${POSTGRES_DB:-codemaven-db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  codemaven_postgres_data:
